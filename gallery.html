<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contestant Video Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .video-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
        }

        .video-thumbnail {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            overflow: hidden;
        }

        .video-thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .play-button:hover {
            background: white;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .play-button::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 18px solid #667eea;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            margin-left: 4px;
        }

        .video-info {
            padding: 20px;
        }

        .contestant-name {
            font-size: 1.2em;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .video-title {
            font-size: 1em;
            color: #555;
            margin-bottom: 12px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .upload-time {
            font-size: 0.85em;
            color: #999;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            color: #333;
            font-size: 1.5em;
        }

        .close-btn {
            font-size: 28px;
            font-weight: bold;
            color: #999;
            cursor: pointer;
            border: none;
            background: none;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-body {
            padding: 20px;
        }

        .video-player {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .video-details {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #333;
        }

        .detail-value {
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            background: white;
            border-radius: 12px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 Contestant Video Gallery</h1>
        <div class="loading" id="loading">Loading videos...</div>
        <div class="gallery-grid" id="gallery"></div>
        <div class="error" id="error" style="display:none;"></div>
    </div>

    <div class="modal" id="videoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Video Title</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="playerContainer"></div>
                <div class="video-details">
                    <div class="detail-row">
                        <span class="detail-label">👤 Contestant:</span>
                        <span class="detail-value" id="detailContestant">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">🎬 Video Title:</span>
                        <span class="detail-value" id="detailTitle">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">⏱️ Uploaded:</span>
                        <span class="detail-value" id="detailUploadTime">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">📦 Public ID:</span>
                        <span class="detail-value" id="detailPublicId">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cloudName = 'YOUR_CLOUD_NAME';

        function formatTime(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);
            
            if (diffInSeconds < 60) return 'Just now';
            if (diffInSeconds < 3600) return Math.floor(diffInSeconds / 60) + 'm ago';
            if (diffInSeconds < 86400) return Math.floor(diffInSeconds / 3600) + 'h ago';
            if (diffInSeconds < 604800) return Math.floor(diffInSeconds / 86400) + 'd ago';
            
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function getThumbnailUrl(publicId) {
            return `https://res.cloudinary.com/${cloudName}/video/fetch/w_300,h_170,c_fill,q_auto/${publicId}.jpg`;
        }

        async function loadVideos() {
            try {
                const response = await fetch('/api/videos');
                const data = await response.json();
                
                const gallery = document.getElementById('gallery');
                const loading = document.getElementById('loading');
                const error = document.getElementById('error');

                if (data.videos && data.videos.length > 0) {
                    gallery.innerHTML = data.videos.map((video, index) => `
                        <div class="video-card" onclick="openModal(${index}, ${JSON.stringify(video).replace(/"/g, '&quot;')})">
                            <div class="video-thumbnail">
                                <img src="${getThumbnailUrl(video.publicId)}" alt="${video.videoTitle}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22170%22%3E%3Crect fill=%22%23333%22 width=%22300%22 height=%22170%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-size=%2216%22 fill=%22%23999%22%3EVideo Thumbnail%3C/text%3E%3C/svg%3E'">
                                <div class="play-button"></div>
                            </div>
                            <div class="video-info">
                                <div class="contestant-name">👤 ${video.contestantName}</div>
                                <div class="video-title">🎬 ${video.videoTitle}</div>
                                <div class="upload-time">⏱️ ${formatTime(video.uploadedAt)}</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    gallery.innerHTML = '<p style="color: white; text-align: center; grid-column: 1/-1;">No videos uploaded yet</p>';
                }
                
                loading.style.display = 'none';
            } catch (err) {
                console.error('Error loading videos:', err);
                document.getElementById('error').textContent = 'Failed to load videos. Make sure the Flask server is running.';
                document.getElementById('error').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        }

        function openModal(index, video) {
            const modal = document.getElementById('videoModal');
            document.getElementById('modalTitle').textContent = video.videoTitle;
            document.getElementById('detailContestant').textContent = video.contestantName;
            document.getElementById('detailTitle').textContent = video.videoTitle;
            document.getElementById('detailUploadTime').textContent = new Date(video.uploadedAt).toLocaleString();
            document.getElementById('detailPublicId').textContent = video.publicId;

            const playerContainer = document.getElementById('playerContainer');
            playerContainer.innerHTML = `
                <iframe
                    src="https://player.cloudinary.com/embed/?cloud_name=${cloudName}&public_id=${video.publicId}"
                    width="100%"
                    height="400"
                    frameborder="0"
                    allowfullscreen
                    class="video-player"
                    allow="autoplay; fullscreen">
                </iframe>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('videoModal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('videoModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        window.addEventListener('load', loadVideos);
    </script>
</body>
</html>
